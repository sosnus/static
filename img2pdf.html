<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aparat -> PDF A4</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    margin:0;
    background:#222;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h2{
    margin:15px;
}

video{
    width:95vw;
    max-height:70vh;
    border-radius:10px;
    background:black;
}

button{
    width:90%;
    max-width:500px;
    font-size:24px;
    padding:18px;
    margin:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#capture{
    background:#2ecc71;
    color:white;
}

#start{
    background:#3498db;
    color:white;
}

canvas{
    display:none;
}
</style>

</head>
<body>

<h2>Aparat → PDF A4</h2>

<video id="video" autoplay playsinline></video>

<br>

<button id="start">
Uruchom kamerę
</button>

<button id="capture">
Zrób zdjęcie i zapisz PDF
</button>

<canvas id="canvas"></canvas>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

let stream=null;

async function startCamera(){

    if(stream){
        return;
    }

    try{

        stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"environment"
            },
            audio:false
        });

        video.srcObject = stream;

    }catch(e){

        alert("Nie udało się uruchomić kamery.\n\n"+e);

    }

}

function fileName(){

    const d=new Date();

    const p=(v)=>String(v).padStart(2,'0');

    return d.getFullYear()+"-"+
           p(d.getMonth()+1)+"-"+
           p(d.getDate())+"_"+
           p(d.getHours())+"-"+
           p(d.getMinutes())+"-"+
           p(d.getSeconds())+".pdf";

}

async function makePDF(){

    if(!stream){
        alert("Najpierw uruchom kamerę.");
        return;
    }

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    const ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0);

    const img=canvas.toDataURL("image/jpeg",1.0);

    const {jsPDF}=window.jspdf;

    const pdf=new jsPDF({
        orientation:"portrait",
        unit:"mm",
        format:"a4"
    });

    const pageW=210;
    const pageH=297;

    const margin=10;

    const maxW=pageW-margin*2;
    const maxH=pageH-margin*2;

    const ratio=Math.min(
        maxW/canvas.width,
        maxH/canvas.height
    );

    const w=canvas.width*ratio;
    const h=canvas.height*ratio;

    const x=(pageW-w)/2;
    const y=(pageH-h)/2;

    pdf.addImage(
        img,
        "JPEG",
        x,
        y,
        w,
        h
    );

    pdf.save(fileName());

}

document.getElementById("start").onclick=startCamera;
document.getElementById("capture").onclick=makePDF;

</script>

</body>
</html>
