### Locale
d-i debian-installer/locale string pl_PL.UTF-8
d-i keyboard-configuration/xkb-keymap select pl

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string rocket
d-i netcfg/get_domain string local

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Users
d-i passwd/root-login boolean false
d-i passwd/user-fullname string tichy
d-i passwd/username string tichy
d-i passwd/user-password-crypted password \
$6$8sY3ZlqF5n2n5cXG$5nY5UQ0pYp8X6Cqk8x0s8N4M5q6Y4B7hH3H8n8k8mG3nQ0xg9V5b6ZqPq0zP4g3e7l3vFQZJ5G7H2Z/

### Time
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Warsaw

### Partitioning
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select custom-min-swap
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Custom minimal recipe: swap 300MB, rest root
d-i partman-auto/expert_recipe string                         \
  custom-min-swap ::                                           \
    300 300 300 linux-swap                                    \
      $primary{ } method{ swap } format{ }                    \
    .                                                          \
    500 10000 -1 ext4                                         \
      $primary{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } \
    .

### Packages
d-i pkgsel/include string sudo git htop nano
d-i pkgsel/install-recommends boolean false

### Do NOT install GUI
d-i tasksel/first multiselect

### Bootloader
d-i grub-installer/only_debian boolean true

### Finish
d-i finish-install/reboot_in_progress note
