# do glownego katalogu ISO
# dopisac do grub.cfg:
###### auto=true priority=critical preseed/file=/cdrom/preseed.cfg
### Locale
d-i debian-installer/locale string pl_PL.UTF-8
d-i keyboard-configuration/xkb-keymap select pl

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string rocket
d-i netcfg/get_domain string local

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Users
d-i passwd/root-login boolean false
d-i passwd/user-fullname string tichy
d-i passwd/username string tichy
# d-i passwd/user-password-crypted password \
# $6$8sY3ZlqF5n2n5cXG$5nY5UQ0pYp8X6Cqk8x0s8N4M5q6Y4B7hH3H8n8k8mG3nQ0xg9V5b6ZqPq0zP4g3e7l3vFQZJ5G7H2Z/

